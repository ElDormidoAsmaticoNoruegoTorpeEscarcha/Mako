<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taller de Creación</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f0f2f5;
margin:0;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

input,select,button{
padding:10px;
margin:5px;
}

button{
background:#1e88e5;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#1565c0;
}

.card{
background:#fafafa;
padding:10px;
margin:10px 0;
border-radius:5px;
}

.hidden{
display:none;
}
</style>
</head>
<body>

<div class="container">

<h1>Taller de Creación</h1>

<div id="login">

<h2>Iniciar sesión</h2>

<input id="email" type="email" placeholder="Correo">

<input id="password" type="password" placeholder="Contraseña">

<button onclick="login()">
Entrar
</button>

</div>

<div id="app" class="hidden">

<h2 id="userInfo"></h2>

<button onclick="logout()">Cerrar Sesión</button>

<hr>

<div id="profesorSection" class="hidden">

<h2>Profesor</h2>

<h3>Registrar Material</h3>

<input id="materialNombre" placeholder="Material">
<input id="materialStock" type="number" placeholder="Stock">

<button onclick="agregarMaterial()">
Agregar Material
</button>

<h3>Lista de Estudiantes</h3>

<div id="estudiantes"></div>

<h3>Solicitudes</h3>

<div id="solicitudes"></div>

</div>

<div>

<h2>Materiales</h2>

<div id="materiales"></div>

<h3>Solicitar Material</h3>

<select id="materialSelect"></select>

<input id="cantidad" type="number">

<button onclick="solicitarMaterial()">
Solicitar
</button>

</div>

<div>

<h2>Mis Asistencias</h2>

<div id="asistencias"></div>

</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

import {
getFirestore,
collection,
doc,
getDoc,
setDoc,
addDoc,
getDocs,
query,
where
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDPQchI0uKXwhpYyW4f0pL24e5--_ul19w",
authDomain: "startapp-9a-a7-mako.firebaseapp.com",
projectId: "startapp-9a-a7-mako",
storageBucket: "startapp-9a-a7-mako.firebasestorage.app",
messagingSenderId: "500756905625",
appId: "1:500756905625:web:cf5d181b1ddc60ee850208"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);

let usuario;
let rol;

window.login = async ()=>{

try{

await signInWithEmailAndPassword(
auth,
email.value,
password.value
);

}catch(error){

alert(error.message);

}

};

window.logout = ()=>{

signOut(auth);

};

onAuthStateChanged(auth,async(user)=>{

if(!user){

document.getElementById("login").classList.remove("hidden");
document.getElementById("app").classList.add("hidden");

return;

}

usuario = user;

document.getElementById("login").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");

const perfil = await getDoc(
doc(db,"usuarios",user.uid)
);

if(perfil.exists()){

rol = perfil.data().rol;

userInfo.innerHTML =
`${perfil.data().nombre} (${rol})`;

if(rol==="profesor"){

profesorSection.classList.remove("hidden");

}

}

cargarMateriales();
cargarAsistencias();
cargarSolicitudes();

});

async function cargarMateriales(){

const snap = await getDocs(
collection(db,"materiales")
);

materiales.innerHTML="";
materialSelect.innerHTML="";

snap.forEach(docu=>{

const m = docu.data();

materiales.innerHTML +=
`
<div class="card">
${m.nombre}
Stock: ${m.stock}
</div>
`;

materialSelect.innerHTML +=
`
<option value="${docu.id}">
${m.nombre}
</option>
`;

});

}

window.agregarMaterial = async ()=>{

if(rol!=="profesor") return;

await addDoc(
collection(db,"materiales"),
{
nombre:materialNombre.value,
stock:Number(materialStock.value)
}
);

cargarMateriales();

};

window.solicitarMaterial = async ()=>{

await addDoc(
collection(db,"solicitudes"),
{
uid:usuario.uid,
material:materialSelect.value,
cantidad:Number(cantidad.value),
estado:"pendiente"
}
);

alert("Solicitud enviada");

};

async function cargarAsistencias(){

let consulta;

if(rol==="profesor"){

consulta = await getDocs(
collection(db,"asistencias")
);

}else{

consulta = await getDocs(
query(
collection(db,"asistencias"),
where("uid","==",usuario.uid)
)
);

}

asistencias.innerHTML="";

consulta.forEach(d=>{

const a = d.data();

asistencias.innerHTML +=
`
<div class="card">
${a.fecha}
-
${a.presente?"✅":"❌"}
</div>
`;

});

}

async function cargarSolicitudes(){

if(rol!=="profesor") return;

const snap = await getDocs(
collection(db,"solicitudes")
);

solicitudes.innerHTML="";

snap.forEach(docu=>{

const s = docu.data();

solicitudes.innerHTML +=
`
<div class="card">
Material: ${s.material}
Cantidad: ${s.cantidad}
Estado: ${s.estado}
</div>
`;

});

}

</script>

</body>
</html>
